{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitfolio | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'frontend/css/home.css' %}">
    <link rel="stylesheet" href="{% static 'frontend/css/navbar.css' %}">

</head>
<body>
    <form action="{% url 'logout' %}" method="POST" class="logout-form">
        {% csrf_token %}
        <button type="submit" class="logout-button">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                Logout
        </button>
    </form>
    <main class="home-container">

    <header class="home-header">
        <h1>FITFOLIO</h1>

        <div class="welcome-message">
            <h2>Welcome!</h2>
            <p>What are we wearing today?</p>
        </div>
    </header>
    <section class="dashboard-content">

    
<div class="weather-card">
    <span class="weather-icon" id="weather-icon">🌤️</span>
    <h3>Today's Weather</h3>
    <p class="temperature" id="weather-temperature">--°F</p>
    <p id="weather-description">Loading weather...</p>
</div>


    <div class="outfit-display">
        <img
            src="{% static 'frontend/images/mannequin-stage.png' %}"
            alt="Fitfolio dressing mannequin"
            class="mannequin-stage"
        >
    </div>

    <div class="outfit-card">
    <span class="outfit-icon">✨</span>
    <h3>Today's  Recommended Outfit</h3>
    <p>No outfit selected yet</p>
    <a href="{% url 'create_outfit' %}">
        <button type="button">Create an Outfit</button>
    </a>
</div>

</section>
</main>
{% include 'frontend/navbar.html' %}
{{ wardrobe_data|json_script:"wardrobe-data" }}
<script src="{% static 'frontend/js/weather.js' %}" defer></script>
</body>
</html>
