
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Fitfolio</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="{% static 'frontend/css/register.css' %}">
</head>

<body>
    <div class="register-container">
        <div class="register-card">

            <h1>Forgot Password?</h1>

            <p class="subtitle">
                No worries! Enter your email and we'll help you reset your password. ♡
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            value="{{ form.email.value|default_if_none:'' }}"
                            autocomplete="email"
                            required>
                    </div>

                    {% for error in form.email.errors %}
                        <p class="field-error">
                            <i class="fa-solid fa-circle-exclamation"></i>
                            {{ error }}
                        </p>
                    {% endfor %}
                </div>

                <button type="submit" class="register-button">
                    Send Reset Link ♡
                </button>
            </form>

            <p class="login-link">
                Remember your password?
                <a href="{% url 'login' %}">Back to Login</a>
            </p>

        </div>
    </div>
</body>
</html>
