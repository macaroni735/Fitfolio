{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitfolio | Clothing Capture</title>
    <link rel="stylesheet" href="{% static 'frontend/css/clothing_capture.css' %}">
</head>
<body>
    <main 
        class="capture-container"
        data-process-url="{% url 'process_clothing_image' %}"
    >

        <form id="csrf-form" hidden>
            {% csrf_token %}
        </form>
        
        <a href="{% url 'wardrobe' %}" class="back-link">← My Wardrobe</a>

        <header>
            <h1>New Clothing</h1>
        </header>

        <!-- Image capture section -->
        <div class="camera-frame" id="camera-frame" hidden>

            <video id="camera" autoplay playsinline hidden></video>
            <img
            id="mannequin-guide"
            src="{% static 'frontend/images/Default Guide.png' %}"
            alt=""
            aria-hidden="true"
            hidden>
            <img id="preview" alt="Clothing photo preview" hidden>
            <div id="placeholder" class="placeholder">
                Your camera preview will appear here.
            </div>
        </div>

        <canvas id="canvas" hidden></canvas>

        <p id="status" role="status">Choose camera or upload a photo.</p>

        <div class="capture-controls">
            <div class="capture-actions">
                <button id="start-camera" type="button">Open Camera</button>
                <button id="take-photo" type="button" hidden>Take Photo</button>
                <button id="retake" type="button" hidden>Retake</button>

                <label class="upload-button" for="photo-upload">
                    Upload Photo
                </label>
                <input id="photo-upload" type="file" accept="image/*" hidden>
            </div>

            <button id="continue-to-editor" type="button" hidden>Next</button>
        </div>

        <!-- Image cleanup section -->
        <section id="editor-step" hidden>
        
            <div id="processing-status" role="status" hidden>
                Please wait a moment while we remove the background...
            </div>
        
            <div id="editor-error" role="alert" hidden></div>
        
            <div id="editor-workspace" hidden>
                <div class="editor-image-frame">
                    <img
                        id="processed-preview"
                        alt="Clothing image"
                    >
                </div>
        
                <p id="editor-success" hidden>Background removed!</p>
            </div>
        
            <div class="editor-controls">
                <button id="back-to-capture" type="button">Back</button>
                <button id="continue-after-processing" type="button" hidden>Next</button>
                <button id="retry-processing" type="button" hidden>Try Again</button>
            </div>
        </section>
        
    </main>

    <script src="{% static 'frontend/js/clothing_capture.js' %}"></script>
</body>
</html>
